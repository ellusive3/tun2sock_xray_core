name: Build ARMv5 Image

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      xray_version:
        description: "Xray-core release tag"
        required: false
        default: "v26.3.27"
      tun2socks_version:
        description: "tun2socks release tag"
        required: false
        default: "v2.7.0"

env:
  XRAY_VERSION: ${{ github.event.inputs.xray_version || 'v26.3.27' }}
  TUN2SOCKS_VERSION: ${{ github.event.inputs.tun2socks_version || 'v2.7.0' }}
  IMAGE_NAME: xray-tun2socks

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # provenance/sbom attestations break RouterOS remote pull / extract on some versions
      - name: Build and push linux/arm/v5
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm/v5
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            XRAY_VERSION=${{ env.XRAY_VERSION }}
            TUN2SOCKS_VERSION=${{ env.TUN2SOCKS_VERSION }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:armv5
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.XRAY_VERSION }}-${{ env.TUN2SOCKS_VERSION }}

      # Prefer importing this .tar on E60iUGS if Docker Hub pull fails with "failed to extract layer"
      - name: Export image tar for MikroTik
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm/v5
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha
          build-args: |
            XRAY_VERSION=${{ env.XRAY_VERSION }}
            TUN2SOCKS_VERSION=${{ env.TUN2SOCKS_VERSION }}
          tags: ${{ env.IMAGE_NAME }}:armv5
          outputs: type=docker,dest=/tmp/${{ env.IMAGE_NAME }}-armv5.tar

      - name: Upload MikroTik image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}-armv5
          path: /tmp/${{ env.IMAGE_NAME }}-armv5.tar
          if-no-files-found: error
